schema_version: "1"
namespace: runtime
name: time
version: 1.0.0
description: Return current UTC time through the authorized clock provider.
runtime_api_version: "1"
sdk_api_version: "1"
required_providers:
  - type: clock
    identity: system.clock.local
    api_version: "1"
entry_point: handler.py:execute
commands:
  - name: runtime.time
    input_schema:
      type: object
      additionalProperties: false
    output_schema:
      type: object
      additionalProperties: false
      required: [utc]
      properties:
        utc:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
    supports_dry_run: false
permissions:
  - provider_access
compatibility:
  python: ">=3.11,<3.15"
lifecycle_status: active
