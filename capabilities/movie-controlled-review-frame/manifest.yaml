schema_version: "1"
namespace: movie
name: controlled-review-frame
version: 1.0.0
description: Runtime-governed one-frame external storyboard review candidate
runtime_api_version: "1"
sdk_api_version: "1"
required_providers:
  - type: controlled_storyboard_image_generation
    identity: movie.storyboard-image.openai
    api_version: "1"
entry_point: handler.py:execute
commands:
  - name: movie.controlled-review-frame-generate
    supports_dry_run: true
    input_schema:
      type: object
      additionalProperties: false
      required: [admission_id, mode]
      properties:
        admission_id: {type: string, pattern: "^[0-9a-f]{64}$"}
        mode: {enum: [preflight, generate]}
    output_schema:
      type: object
      additionalProperties: false
      required: [status, request_sha256, provider_call_count, attempt_reserved, artifact_root, image, candidate, review, estimated_cost_usd, authority]
      properties:
        status: {enum: [ready_for_approval, generated_awaiting_human_review]}
        request_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        provider_call_count: {type: integer, minimum: 0, maximum: 1}
        attempt_reserved: {type: boolean}
        artifact_root: {type: [string, "null"], maxLength: 512}
        image: {type: [string, "null"], maxLength: 512}
        candidate: {type: [string, "null"], maxLength: 512}
        review: {type: [string, "null"], maxLength: 512}
        estimated_cost_usd: {type: [string, "null"], pattern: "^[0-9]+\\.[0-9]{6}$"}
        authority:
          type: object
          additionalProperties: false
          required: [production, asset, publication, export, scheduling, workflow, provider_execution, runtime_execution]
          properties:
            production: {const: false}
            asset: {const: false}
            publication: {const: false}
            export: {const: false}
            scheduling: {const: false}
            workflow: {const: false}
            provider_execution: {const: false}
            runtime_execution: {const: false}
permissions: [provider_access, filesystem_write, network, secrets]
compatibility:
  python: ">=3.11"
lifecycle_status: active
