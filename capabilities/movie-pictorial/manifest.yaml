schema_version: "1"
namespace: movie
name: pictorial-frame-generation
version: 1.0.0
description: Generate one admitted storyboard frame as local development review media.
runtime_api_version: "1"
sdk_api_version: "1"
required_providers:
  - type: storyboard_image_generation
    identity: movie.storyboard-image.local
    api_version: "1"
entry_point: handler.py:execute
commands:
  - name: movie.pictorial-frame-generate
    input_schema:
      type: object
      additionalProperties: false
      required: [admission_id]
      properties:
        admission_id: {type: string, pattern: "^[0-9a-f]{64}$"}
    output_schema:
      type: object
      additionalProperties: false
      required: [review_media_status, artifact_path, media_type, width, height, content_sha256, execution_attempt_id, project_id, scene_id, storyboard_specification_digest, frame_id, frame_specification_digest, knowledge_lineage_digest, semantic_request_digest, provider_visible_digest, provider_identity, provider_version, provider_call_count, authority_boundary]
      properties:
        review_media_status: {enum: [development_review_media, validation_only]}
        artifact_path: {type: [string, "null"], pattern: "^\\.local/movie/storyboard-images/[0-9a-f]{64}/frame-[0-9a-f]{24}/[0-9a-f]{64}\\.png$"}
        media_type: {type: [string, "null"], enum: [image/png, null]}
        width: {type: [integer, "null"], enum: [640, null]}
        height: {type: [integer, "null"], enum: [360, null]}
        content_sha256: {type: [string, "null"], pattern: "^[0-9a-f]{64}$"}
        execution_attempt_id: {type: string, pattern: "^[0-9a-f]{32}$"}
        project_id: {type: string, minLength: 1, maxLength: 64, pattern: "^[a-z0-9][a-z0-9-]*$"}
        scene_id: {type: string, pattern: "^scene-[a-z0-9][a-z0-9-]{0,62}$"}
        storyboard_specification_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        frame_id: {type: string, pattern: "^frame-[0-9a-f]{24}$"}
        frame_specification_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        knowledge_lineage_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        semantic_request_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        provider_visible_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
        provider_identity: {const: movie.storyboard-image.local}
        provider_version: {const: 1.0.0}
        provider_call_count: {type: integer, minimum: 0, maximum: 1}
        authority_boundary:
          type: object
          additionalProperties: false
          required: [production_approval, production_asset_admission, final_frame_selection, publication_authority, scheduling_authority, workflow_authority, autonomous_authority, reusable_execution_authority]
          properties:
            production_approval: {const: false}
            production_asset_admission: {const: false}
            final_frame_selection: {const: false}
            publication_authority: {const: false}
            scheduling_authority: {const: false}
            workflow_authority: {const: false}
            autonomous_authority: {const: false}
            reusable_execution_authority: {const: false}
    supports_dry_run: true
permissions:
  - provider_access
  - filesystem_write
compatibility:
  python: ">=3.11,<3.15"
lifecycle_status: active
