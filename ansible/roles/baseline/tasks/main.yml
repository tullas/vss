---
- name: Validate baseline workspace configuration
  ansible.builtin.assert:
    that:
      - baseline_workspace is match('^/')
      - baseline_workspace_mode is match('^[0-7]{4}$')
    fail_msg: >-
      baseline_workspace must be an absolute path and
      baseline_workspace_mode must contain four octal digits.

- name: Create baseline workspace
  ansible.builtin.file:
    path: "{{ baseline_workspace }}"
    state: directory
    mode: "{{ baseline_workspace_mode }}"

- name: Install common packages
  ansible.builtin.package:
    name:
      - curl
      - wget
      - unzip
      - tar
      - git
      - vim
    state: present

- name: Ensure /opt exists
  ansible.builtin.file:
    path: /opt
    state: directory
    mode: "0755"

- name: Ensure VSS log directory exists
  ansible.builtin.file:
    path: /var/log/vss
    state: directory
    mode: "0755"

- name: Display baseline completion
  ansible.builtin.debug:
    msg: Baseline role completed successfully.
