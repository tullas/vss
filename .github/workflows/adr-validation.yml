name: ADR Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-adr:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate ADR documents
      run: |
        chmod +x scripts/validate_adr.sh
        ./scripts/validate_adr.sh
