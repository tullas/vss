name: Build VSS security derivatives

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, attest, and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Authenticate to the repository container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Start the pinned attestation-capable builder
        run: >-
          docker buildx create --name vss-security-builder --use --bootstrap
          --driver docker-container
          --driver-opt image=moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528 # pragma: allowlist secret -- deterministic image digest
      - name: Build, verify, and publish the exact reviewed VersityGW derivative
        env:
          SOURCE_DATE_EPOCH: '1784082912'
        run: | # pragma: allowlist secret -- deterministic binary digest below
          set -Eeuo pipefail
          repository='ghcr.io/tullas/vss/versitygw'
          image="$repository:v1.7.0-go1.25.13-r4"
          metadata="$RUNNER_TEMP/versitygw-build-metadata.json"
          docker buildx build \
            --file containers/versitygw/Dockerfile \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$metadata" \
            --tag "$image" \
            --push \
            containers/versitygw
          digest=$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")
          reference="$repository@$digest"
          docker buildx imagetools inspect "$reference"
          index_raw=$(docker buildx imagetools inspect --raw "$reference")
          platform_digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
            | if length == 1 then .[0].digest else error("expected one linux/amd64 platform manifest") end
            | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$index_raw")
          platform_raw=$(docker buildx imagetools inspect --raw "$repository@$platform_digest")
          config_digest=$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$platform_raw")
          observed_binary=$(docker run --rm --platform linux/amd64 --entrypoint sha256sum \
            "$reference" /usr/local/bin/versitygw | awk '{print $1}')
          test "$observed_binary" = '7ec13c1c2b8169e67c0b840039b3a06d085ea4f48657cbb4dd1cad31643e75b8'
          jq -ncer --arg index_digest "$digest" --arg platform_digest "$platform_digest" --arg config_digest "$config_digest" \
            '{index_digest: $index_digest, platform_digest: $platform_digest, config_digest: $config_digest}'
      - name: Build, verify, and publish the exact reviewed Ubuntu acceptance derivative
        env:
          SOURCE_DATE_EPOCH: '1786957365'
        run: |
          set -Eeuo pipefail
          repository='ghcr.io/tullas/vss/ubuntu-26.04-acceptance'
          image="$repository:26.04-2026-08-17-no-pebble-r2"
          metadata="$RUNNER_TEMP/ubuntu-acceptance-build-metadata.json"
          docker buildx build \
            --file containers/ubuntu-26.04-acceptance/Dockerfile \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$metadata" \
            --tag "$image" \
            --push \
            containers/ubuntu-26.04-acceptance
          digest=$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")
          reference="$repository@$digest"
          docker buildx imagetools inspect "$reference"
          index_raw=$(docker buildx imagetools inspect --raw "$reference")
          platform_digest=$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
            | if length == 1 then .[0].digest else error("expected one linux/amd64 platform manifest") end
            | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$index_raw")
          platform_raw=$(docker buildx imagetools inspect --raw "$repository@$platform_digest")
          config_digest=$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$platform_raw")
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash \
            "$reference" -ceu 'test ! -e /usr/bin/pebble'
          jq -ncer --arg index_digest "$digest" --arg platform_digest "$platform_digest" --arg config_digest "$config_digest" \
            '{index_digest: $index_digest, platform_digest: $platform_digest, config_digest: $config_digest}'
      - name: Remove the ephemeral builder
        if: always()
        run: docker buildx rm vss-security-builder
