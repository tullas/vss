name: Build VersityGW security derivative

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, attest, and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Authenticate to the repository container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Start the pinned attestation-capable builder
        run: >-
          docker buildx create --name vss-security-builder --use --bootstrap
          --driver docker-container
          --driver-opt image=moby/buildkit@sha256:040d34121c27906c4ff9ac152a30d52bf2c5d328d3bb748916bb3d2743c02528
      - name: Build and publish the exact reviewed derivative
        env:
          SOURCE_DATE_EPOCH: '1784082912'
        run: |
          set -Eeuo pipefail
          image='ghcr.io/tullas/vss/versitygw:v1.7.0-go1.25.13-r1'
          docker buildx build \
            --file containers/versitygw/Dockerfile \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=mode=max \
            --sbom=true \
            --tag "$image" \
            --push \
            containers/versitygw
          docker buildx imagetools inspect "$image"
      - name: Remove the ephemeral builder
        if: always()
        run: docker buildx rm vss-security-builder
