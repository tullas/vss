name: Ansible Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ansible-validation:
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Ansible tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/development.lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Verify Ansible configuration
        run: |
          ansible --version
          ansible-config dump --only-changed
          test -f ansible/roles/baseline/tasks/main.yml

      - name: Validate inventory
        run: |
          ansible-inventory \
            -i ansible/inventories/development/hosts.yml \
            --list > /dev/null

      - name: Ansible syntax check
        run: |
          ansible-playbook \
            --syntax-check \
            -i ansible/inventories/development/hosts.yml \
            ansible/playbooks/site.yml
          ansible-playbook \
            --syntax-check \
            -i ansible/inventories/development/hosts.yml \
            ansible/playbooks/bootstrap-local.yml

      - name: Ansible lint
        run: ansible-lint ansible/playbooks/site.yml ansible/playbooks/bootstrap-local.yml
