name: Ansible Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  ansible-validation:

    runs-on: ubuntu-latest

    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      ANSIBLE_LOCAL_TEMP: ${{ runner.temp }}/ansible

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Ansible tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Verify Ansible configuration
      run: |
        pwd
        ls -la
        ansible --version
        ansible-config dump --only-changed

    - name: Validate development inventory
      run: |
        ansible-inventory -i ansible/inventories/development/hosts.yml --graph
        ansible-inventory -i ansible/inventories/development/hosts.yml --list >/dev/null

    - name: Ansible syntax check
      run: |
        ansible-playbook \
          --syntax-check \
          -i ansible/inventories/development/hosts.yml \
          ansible/playbooks/site.yml


    - name: Ansible lint
      run: |
        ansible-lint ansible/playbooks/site.yml
