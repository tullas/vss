name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      release_version:
        description: Immutable release version to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Deploy
        env:
          CONFIG_ENV: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}
          HEALTHCHECK_SCRIPT: ${{ vars.HEALTHCHECK_SCRIPT }}
          ROLLBACK_SCRIPT: ${{ vars.ROLLBACK_SCRIPT }}
        run: bash scripts/deploy.sh "${CONFIG_ENV}" "${RELEASE_VERSION}"
