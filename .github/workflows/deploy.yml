name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        required: true
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          CONFIG_ENV: ${{ inputs.environment }}
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}
        run: bash scripts/deploy.sh "${CONFIG_ENV}"
