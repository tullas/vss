name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: Check shell syntax
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0r bash -n
      - name: Check whitespace errors
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install configuration engine
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/runtime.lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Test configuration engine
        run: python -m unittest discover -s tests/config_engine -p 'test_*.py'
      - name: Test command engine
        run: python -m unittest discover -s tests/command_engine -p 'test_*.py'
      - name: Test runtime kernel
        run: python -m unittest discover -s tests/runtime -p 'test_*.py'
      - name: Test capability SDK
        run: python -m unittest discover -s tests/sdk -p 'test_*.py'
      - name: Test provider abstraction
        run: python -m unittest discover -s tests/providers -p 'test_*.py'
      - name: Test workflow engine
        run: python -m unittest discover -s tests/workflows -p 'test_*.py'
      - name: Test architecture dependency boundaries
        run: python -m unittest discover -s tests/architecture -p 'test_*.py'
      - name: Test semantic reasoning contracts
        run: python -m unittest discover -s tests/reasoning_contracts -p 'test_*.py'
      - name: Test deterministic reasoning gateway
        run: |
          python -m unittest discover -s tests/reasoning -p 'test_*.py'
          vss reasoning generate-options --environment development --input tests/fixtures/reasoning/generate-options-runtime-valid.json --context tests/fixtures/context/context-object-reasoning-valid.json --correlation-id m3-2-local-acceptance
          vss reasoning generate-options --environment development --input tests/fixtures/reasoning/generate-options-runtime-valid.json --correlation-id m3-2-local-acceptance
          vss reasoning generate-options --environment development --input tests/fixtures/reasoning/generate-options-runtime-valid.json --context tests/fixtures/context/context-object-reasoning-valid.json --correlation-id m3-2-local-acceptance --dry-run
      - name: Test local performance laboratory
        run: |
          python -m unittest discover -s tests/performance -p 'test_*.py'
          vss performance reasoning --profile ci_safe --environment development
      - name: Test bounded knowledge packages
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_*.py'
          vss knowledge package validate --input tests/fixtures/knowledge/knowledge-package-valid.json --environment development --correlation-id m3-4-ci-validation
      - name: Test movie contract validation
        run: |
          python -m unittest discover -s tests/movie_contracts -p 'test_*.py'
          python -m unittest discover -s tests/character_continuity_contracts -p 'test_*.py'
          python -m unittest discover -s tests/shot_observation_contracts -p 'test_*.py'
          python -m unittest discover -s tests/shot_observation_context -p 'test_*.py'
          python -m unittest discover -s tests/shot_cinematography_patterns -p 'test_*.py'
          python -m unittest discover -s tests/shot_cinematography_lessons -p 'test_*.py'
          python -m unittest discover -s tests/shot_cinematography_knowledge -p 'test_*.py'
      - name: Validate deterministic movie contract fixtures
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from vss_movie_contracts import MovieContractRegistry, validate_story_fragment, validate_scene_breakdown, validate_scene_task
          from vss_reasoning_contracts import load_json_document
          root = Path.cwd()
          def run():
              registry = MovieContractRegistry.built_in()
              story = validate_story_fragment(load_json_document((root / 'tests/fixtures/movie/story-fragment-valid.json').read_bytes()), registry)
              breakdown = validate_scene_breakdown(load_json_document((root / 'tests/fixtures/movie/scene-breakdown-valid.json').read_bytes()), registry)
              task = {'schema_version':'1','task_identity':'break_down_scenes','task_version':'1','result_family':'scene_breakdown','result_version':'1','project_id':'movie-lab','purpose':'scene_breakdown_local_validation','bounds':{'maximum_scenes':4},'lifecycle':'active'}
              validate_scene_task(task, registry)
              return registry.digest, story.digest, breakdown.digest
          first = run(); second = run()
          assert first == second
          print('movie registry/story/scene digests:', *first)
          PY
      - name: Validate deterministic M5.1 character continuity fixtures
        run: | # pragma: allowlist secret -- deterministic SHA-256 acceptance values below
          PYTHONPATH=src:tests/character_continuity_contracts python - <<'PY'
          from fixtures import identity, observation, reference, result, scene_breakdown, sequence, task
          from vss_movie_contracts import (MovieContractRegistry, validate_character_reference,
              validate_character_identity, validate_character_observation,
              validate_character_continuity_observation_set, validate_character_continuity_task,
              validate_continuity_sequence, validate_scene_breakdown)
          expected = (
              'a40c74f0602ed1251b58ef5a3bade69dfaa48f3257b14e2c54c53c9838f9e381',
              'f58e461dfa72934457109b301c00faac53df3efe7f5e4c99c6e2356fa95a301b',
              '23f6062d723c948e2f1f5c64717d0e0d7f7afa019e5ef60f3052099aefe1f6d9',
              '0b182656c967875794fce9489b9e0f29095f219c39f5d1f79d642eba66745a6f',
              '6364ed22b81f711f9db631ebeab01b12f11cfeb1f80f2113ba1f8eefa85490c4',
              '6b08807f038fe6d073ecfd5db2518aabc0599397aa0740f8bc6e7499283a3976',
              '472ed146c7b0bd6334ab8db4c831971ce0df256ab8aab3751bc33fd4c396c295')
          def run():
              registry=MovieContractRegistry.built_in()
              breakdown=validate_scene_breakdown(scene_breakdown(),registry)
              sequence_value=sequence(breakdown)
              admitted_sequence=validate_continuity_sequence(sequence_value,breakdown,registry)
              reference_value=reference()
              admitted_reference=validate_character_reference(reference_value,registry)
              admitted_identity=validate_character_identity(identity([reference_value]),[admitted_reference],registry)
              values=[observation(sequence_value,c,n) for c,n in (('presence',1),('possession',1),('physical_state',3))]
              observations=[validate_character_observation(value,admitted_identity,admitted_sequence,registry) for value in values]
              admitted_task=validate_character_continuity_task(task(sequence_value),admitted_sequence,[admitted_identity],registry)
              admitted_result=validate_character_continuity_observation_set(result(sequence_value,values),observations,admitted_sequence,admitted_task,registry)
              return (registry.digest, admitted_reference.value['content_digest'], admitted_identity.value['content_digest'],
                  admitted_sequence.value['content_digest'], admitted_task.value['task_content_digest'],
                  admitted_result.value['payload']['semantic_result_digest'], admitted_result.value['integrity']['complete_result_sha256'])
          assert run() == expected
          assert run() == expected
          print('M5.1 deterministic fixture digests:', *expected)
          PY
      - name: Test governed M5.2 and M5.3 character continuity reasoning
        run: |
          python -m unittest discover -s tests/character_continuity -p 'test_*.py'
          python -m unittest discover -s tests/character_continuity_contracts -p 'test_*.py'
          PYTHONPATH=src:tests/character_continuity_contracts python - <<'PY'
          from fixtures import identity, observation, reference, scene_breakdown, sequence, task, transition_evidence
          from vss_commands.runner import CommandRunner
          from vss_context_contracts import ContextContractRegistry, validate_context
          from vss_movie_contracts import (MovieContractRegistry, validate_character_identity,
              validate_character_observation, validate_character_reference,
              validate_continuity_sequence, validate_executable_character_continuity_task,
              validate_scene_breakdown, validate_character_continuity_transition_evidence)
          registry=MovieContractRegistry.built_in(); breakdown=validate_scene_breakdown(scene_breakdown(),registry)
          seq=validate_continuity_sequence(sequence(breakdown),breakdown,registry); ref=validate_character_reference(reference(),registry)
          ident=validate_character_identity(identity([ref.to_json_value()]),[ref],registry)
          executable=validate_executable_character_continuity_task(task(seq.value,'2'),seq,[ident],registry)
          obs=validate_character_observation(observation(seq.value,'possession',1),ident,seq,registry)
          bundle={'task':executable.to_json_value(),'scene_breakdown':breakdown.to_json_value(),'continuity_sequence':seq.to_json_value(),'character_references':[ref.to_json_value()],'character_identities':[ident.to_json_value()],'character_observations':[obs.to_json_value()]}
          runner=CommandRunner(); assembled,code=runner.run('movie.context-assemble-character-continuity','development',bundle,executable.value['correlation_id'])
          assert code == 0; context=assembled['output']['context']; validate_context(context,ContextContractRegistry.built_in())
          one,code=runner.run('movie.analyze-character-continuity','development',{**bundle,'context':context},executable.value['correlation_id']); assert code == 0
          two,code=runner.run('movie.analyze-character-continuity','development',{**bundle,'context':context},executable.value['correlation_id']); assert code == 0
          dry,code=runner.run('movie.analyze-character-continuity','development',{**bundle,'context':context},executable.value['correlation_id'],dry_run=True); assert code == 0
          assert one['output']['semantic_result_digest'] == two['output']['semantic_result_digest']
          assert dry['output']['readiness']['provider_call_count'] == 0 and dry['output']['readiness']['result_digest'] is None
          assert not any(term in str(one['output']).lower() for term in ('does_not_possess',' lost','removed','transition_id','contradiction_id'))
          validation_only={**bundle,'task':task(seq.value,'1')}; denied,code=runner.run('movie.analyze-character-continuity','development',{**validation_only,'context':context},executable.value['correlation_id'])
          assert code != 0
          task3=validate_executable_character_continuity_task(task(seq.value,'3'),seq,[ident],registry)
          raw3=observation(seq.value,'possession',3); obs3=validate_character_observation(raw3,ident,seq,registry)
          transition=validate_character_continuity_transition_evidence(transition_evidence(seq.value,obs.to_json_value(),raw3),(obs,obs3),seq,registry)
          bundle3={**bundle,'task':task3.to_json_value(),'character_observations':[obs.to_json_value(),obs3.to_json_value()],'transition_evidence':[transition.to_json_value()]}
          assembled3,code=runner.run('movie.context-assemble-character-continuity','development',bundle3,task3.value['correlation_id']); assert code == 0
          context3=assembled3['output']['context']; validate_context(context3,ContextContractRegistry.built_in())
          result3,code=runner.run('movie.analyze-character-continuity','development',{**bundle3,'context':context3},task3.value['correlation_id']); assert code == 0
          result3_again,code=runner.run('movie.analyze-character-continuity','development',{**bundle3,'context':context3},task3.value['correlation_id']); assert code == 0
          dry3,code=runner.run('movie.analyze-character-continuity','development',{**bundle3,'context':context3},task3.value['correlation_id'],dry_run=True); assert code == 0
          assert len(result3['output']['character_continuity_observation_set']['payload']['explicit_transitions']) == 1
          assert result3['output']['character_continuity_observation_set']['payload']['contradictions'] == []
          assert result3['output']['semantic_result_digest'] == result3_again['output']['semantic_result_digest']
          assert dry3['output']['readiness']['provider_call_count'] == 0 and dry3['output']['readiness']['result_digest'] is None
          bundle3_without={**bundle3,'transition_evidence':[]}
          assembled_without,code=runner.run('movie.context-assemble-character-continuity','development',bundle3_without,task3.value['correlation_id']); assert code == 0
          without,code=runner.run('movie.analyze-character-continuity','development',{**bundle3_without,'context':assembled_without['output']['context']},task3.value['correlation_id']); assert code == 0
          assert without['output']['character_continuity_observation_set']['payload']['explicit_transitions'] == []
          assert without['output']['character_continuity_observation_set']['payload']['contradictions'] == []
          PY
      - name: Test deterministic movie scene breakdown
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from vss_reasoning_contracts import load_json_document, canonical_digest
          from vss_movie_scene_breakdown import assemble_scene_context, break_down_scenes
          root=Path.cwd(); story=load_json_document((root/'tests/fixtures/movie/story-fragment-valid.json').read_bytes())
          def run():
              context=assemble_scene_context(story, request_id='m4-2-request-001', correlation_id='m4-2-local-run', project_id=story['project_id'], validation_time='2026-08-02T00:00:00Z')
              result=break_down_scenes(context, now='2026-08-02T00:00:01Z')
              return context.digest, canonical_digest(result)
          assert run()==run(); print('scene context/result digests:', *run())
          PY
      - name: Test governed movie scene production options
        run: |
          python -m unittest discover -s tests/movie_production_options -p 'test_*.py'
          python -m unittest discover -s tests/movie_option_review -p 'test_*.py'
          python -m unittest discover -s tests/movie_shot_plan -p 'test_*.py'
          python -m unittest discover -s tests/movie_storyboard -p 'test_*.py'
          vss movie context-assemble-scene-production-options --request tests/fixtures/movie/scene-production-options-context-request-valid.json --scene-breakdown tests/fixtures/movie/scene-breakdown-valid.json --environment development --correlation-id m4-3-local-run
          vss context validate --input tests/fixtures/movie/scene-production-options-context-valid.json --environment development --correlation-id m4-3-local-run
          vss movie generate-scene-production-options --request tests/fixtures/movie/generate-scene-production-options-request-valid.json --context tests/fixtures/movie/scene-production-options-context-valid.json --environment development --correlation-id m4-3-local-run
          vss movie generate-scene-production-options --request tests/fixtures/movie/generate-scene-production-options-request-valid.json --context tests/fixtures/movie/scene-production-options-context-valid.json --environment development --correlation-id m4-3-local-run --dry-run
          python - <<'PY'
          import json, subprocess
          base=['vss','movie','generate-scene-production-options','--request','tests/fixtures/movie/generate-scene-production-options-request-valid.json','--context','tests/fixtures/movie/scene-production-options-context-valid.json','--environment','development','--correlation-id','m4-3-local-run']
          one=json.loads(subprocess.run(base,check=True,capture_output=True,text=True).stdout)
          two=json.loads(subprocess.run(base,check=True,capture_output=True,text=True).stdout)
          dry=json.loads(subprocess.run(base+['--dry-run'],check=True,capture_output=True,text=True).stdout)
          for result in (one,two,dry):
              assert result['exit_code']==0 and result['correlation_id']=='m4-3-local-run' and result['status']=='success'
          a,b=one['output'],two['output']
          assert a['semantic_result_digest']==b['semantic_result_digest']
          assert [o['option_id'] for o in a['scene_production_option_set']['payload']['options']]==[o['option_id'] for o in b['scene_production_option_set']['payload']['options']]
          assert a['provider_call_count']==1 and dry['output']['readiness']['provider_call_count']==0
          assert dry['output']['readiness']['result_digest'] is None
          assert a['provider_visible_digest'] and a['invocation_binding_digest'] and a['profile_catalogue_digest']
          PY
      - name: Test deterministic Context Assembly
        run: |
          python -m unittest discover -s tests/context -p 'test_*.py'
          vss context assemble --request tests/fixtures/context/context-assembly-request-valid.json --package tests/fixtures/knowledge/knowledge-package-valid.json --environment development --correlation-id m3-5-local-assemble
          vss context validate --input tests/fixtures/context/context-object-valid.json --environment development --correlation-id m3-5-ci-validation
      - name: Test infrastructure contract
        run: python -m unittest discover -s tests/iac_contract -p 'test_*.py'
      - name: Test security supply-chain controls
        run: python -m unittest discover -s tests/security -p 'test_*.py'
      - name: Check Ansible syntax
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/bootstrap-py312.lock.txt
          ansible-inventory -i ansible/inventories/development/hosts.yml --list > /dev/null
          ansible-playbook --syntax-check -i ansible/inventories/development/hosts.yml ansible/playbooks/site.yml
          ansible-playbook --syntax-check -i ansible/inventories/development/hosts.yml ansible/playbooks/bootstrap-local.yml
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.9.0
      - name: Check infrastructure formatting and validation
        run: |
          tofu fmt -check -recursive infrastructure
          while IFS= read -r environment; do
            if [[ $environment == infrastructure/environments/development/local ]]; then
              tofu -chdir="$environment" init -backend=false -lockfile=readonly
            else
              tofu -chdir="$environment" init -backend=false
            fi
            tofu -chdir="$environment" validate
          done < <(find infrastructure/environments -type f -name '*.tf' -printf '%h\n' | sort -u)
      - name: Authenticate for the admitted VSS-maintained acceptance image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username '${{ github.actor }}' --password-stdin
      - name: Test hardened object-storage lifecycle and S3 contract
        run: scripts/acceptance-object-storage.sh

  test:
    name: Test
    needs: [secret-scan, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run Bash test suite
        id: bash-tests
        shell: bash
        run: |
          set -uo pipefail
          report="bash-test-report.txt"
          : > "$report"
          status=0
          mapfile -d '' test_files < <(find tests -type f -name '*-test.sh' -print0 | sort -z)
          if (( ${#test_files[@]} == 0 )); then
            echo "No Bash tests found" | tee -a "$report"
          fi
          for test_file in "${test_files[@]}"; do
            echo "===== ${test_file} =====" | tee -a "$report"
            if bash "$test_file" >> "$report" 2>&1; then
              echo "PASS: ${test_file}" | tee -a "$report"
            else
              rc=$?
              echo "FAIL: ${test_file} (exit ${rc})" | tee -a "$report"
              status=1
            fi
          done
          cat "$report"
          exit "$status"
      - name: Test phase 0 on clean Ubuntu 26.04
        run: scripts/acceptance-ubuntu-26.04-image.sh
