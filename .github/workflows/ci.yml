name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check shell syntax
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0r bash -n
      - name: Check whitespace errors
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install configuration engine
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
      - name: Test configuration engine
        run: python -m unittest discover -s tests/config_engine -p 'test_*.py'
      - name: Test command engine
        run: python -m unittest discover -s tests/command_engine -p 'test_*.py'
      - name: Test infrastructure contract
        run: python -m unittest discover -s tests/iac_contract -p 'test_*.py'
      - name: Check Ansible syntax
        run: |
          python -m pip install --disable-pip-version-check -r requirements-bootstrap.txt
          ansible-inventory -i ansible/inventories/development/hosts.yml --list > /dev/null
          ansible-playbook --syntax-check -i ansible/inventories/development/hosts.yml ansible/playbooks/site.yml
          ansible-playbook --syntax-check -i ansible/inventories/development/hosts.yml ansible/playbooks/bootstrap-local.yml
      - uses: opentofu/setup-opentofu@v1
      - name: Check infrastructure formatting and validation
        run: |
          tofu fmt -check -recursive infrastructure
          while IFS= read -r environment; do
            tofu -chdir="$environment" init -backend=false
            tofu -chdir="$environment" validate
          done < <(find infrastructure/environments -type f -name '*.tf' -printf '%h\n' | sort -u)

  test:
    name: Test
    needs: [secret-scan, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run Bash test suite
        id: bash-tests
        shell: bash
        run: |
          set -uo pipefail
          report="bash-test-report.txt"
          : > "$report"
          status=0
          mapfile -d '' test_files < <(find tests -type f -name '*-test.sh' -print0 | sort -z)
          if (( ${#test_files[@]} == 0 )); then
            echo "No Bash tests found" | tee -a "$report"
          fi
          for test_file in "${test_files[@]}"; do
            echo "===== ${test_file} =====" | tee -a "$report"
            if bash "$test_file" >> "$report" 2>&1; then
              echo "PASS: ${test_file}" | tee -a "$report"
            else
              rc=$?
              echo "FAIL: ${test_file} (exit ${rc})" | tee -a "$report"
              echo "--- trace: ${test_file} ---" >> "$report"
              bash -x "$test_file" >> "$report" 2>&1 || true
              status=1
            fi
          done
          cat "$report"
          exit "$status"
      - name: Upload Bash test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bash-test-report
          path: bash-test-report.txt
          if-no-files-found: error
      - name: Test phase 0 on clean Ubuntu 26.04
        run: scripts/acceptance-ubuntu-26.04-image.sh
