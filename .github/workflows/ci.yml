name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check shell syntax
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0r bash -n
      - name: Check whitespace errors
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          fi

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash test suite
        run: find tests -type f -name '*-test.sh' -print0 | sort -z | xargs -0r -n1 bash
