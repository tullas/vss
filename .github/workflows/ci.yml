name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check shell syntax
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0r bash -n
      - name: Check whitespace errors
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Ansible syntax
        run: |
          python -m pip install --disable-pip-version-check 'ansible-core>=2.16,<2.20'
          cd ansible
          ansible-playbook --syntax-check -i inventories/development/hosts.yml.example playbooks/site.yml
      - uses: opentofu/setup-opentofu@v1
      - name: Check infrastructure formatting and validation
        run: |
          tofu fmt -check -recursive infrastructure
          for environment in infrastructure/environments/*; do
            tofu -chdir="$environment" init -backend=false
            tofu -chdir="$environment" validate
          done

  test:
    name: Test
    needs: [secret-scan, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash test suite
        run: find tests -type f -name '*-test.sh' -print0 | sort -z | xargs -0r -n1 bash
