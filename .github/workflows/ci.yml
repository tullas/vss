name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: Check shell syntax
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0r bash -n
      - name: Check whitespace errors
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --check HEAD^ HEAD
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install configuration engine
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/runtime.lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Test configuration engine
        run: python -m unittest discover -s tests/config_engine -p 'test_*.py'
      - name: Test command engine
        run: python -m unittest discover -s tests/command_engine -p 'test_*.py'
      - name: Test runtime kernel
        run: python -m unittest discover -s tests/runtime -p 'test_*.py'
      - name: Test capability SDK
        run: python -m unittest discover -s tests/sdk -p 'test_*.py'
      - name: Test provider abstraction
        run: python -m unittest discover -s tests/providers -p 'test_*.py'
      - name: Test workflow engine
        run: python -m unittest discover -s tests/workflows -p 'test_*.py'
      - name: Test semantic reasoning contracts
        run: python -m unittest discover -s tests/reasoning_contracts -p 'test_*.py'
      - name: Test deterministic reasoning gateway
        run: |
          python -m unittest discover -s tests/reasoning -p 'test_*.py'
          vss reasoning generate-options --environment development --input tests/fixtures/reasoning/generate-options-runtime-valid.json --context tests/fixtures/context/context-object-reasoning-valid.json --correlation-id m3-2-local-acceptance
          vss reasoning generate-options --environment development --input tests/fixtures/reasoning/generate-options-runtime-valid.json --correlation-id m3-2-local-acceptance
          vss reasoning generate-options --environment development --input tests/fixtures/reasoning/generate-options-runtime-valid.json --context tests/fixtures/context/context-object-reasoning-valid.json --correlation-id m3-2-local-acceptance --dry-run
      - name: Test local performance laboratory
        run: |
          python -m unittest discover -s tests/performance -p 'test_*.py'
          vss performance reasoning --profile ci_safe --environment development
      - name: Test bounded knowledge packages
        run: |
          python -m unittest discover -s tests/knowledge -p 'test_*.py'
          vss knowledge package validate --input tests/fixtures/knowledge/knowledge-package-valid.json --environment development --correlation-id m3-4-ci-validation
      - name: Test movie contract validation
        run: python -m unittest discover -s tests/movie_contracts -p 'test_*.py'
      - name: Validate deterministic movie contract fixtures
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from vss_movie_contracts import MovieContractRegistry, validate_story_fragment, validate_scene_breakdown, validate_scene_task
          from vss_reasoning_contracts import load_json_document
          root = Path.cwd()
          def run():
              registry = MovieContractRegistry.built_in()
              story = validate_story_fragment(load_json_document((root / 'tests/fixtures/movie/story-fragment-valid.json').read_bytes()), registry)
              breakdown = validate_scene_breakdown(load_json_document((root / 'tests/fixtures/movie/scene-breakdown-valid.json').read_bytes()), registry)
              task = {'schema_version':'1','task_identity':'break_down_scenes','task_version':'1','result_family':'scene_breakdown','result_version':'1','project_id':'movie-lab','purpose':'scene_breakdown_local_validation','bounds':{'maximum_scenes':4},'lifecycle':'active'}
              validate_scene_task(task, registry)
              return registry.digest, story.digest, breakdown.digest
          first = run(); second = run()
          assert first == second
          print('movie registry/story/scene digests:', *first)
          PY
      - name: Test deterministic movie scene breakdown
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from vss_reasoning_contracts import load_json_document, canonical_digest
          from vss_movie_scene_breakdown import assemble_scene_context, break_down_scenes
          root=Path.cwd(); story=load_json_document((root/'tests/fixtures/movie/story-fragment-valid.json').read_bytes())
          def run():
              context=assemble_scene_context(story, request_id='m4-2-request-001', correlation_id='m4-2-local-run', project_id=story['project_id'], validation_time='2026-08-02T00:00:00Z')
              result=break_down_scenes(context, now='2026-08-02T00:00:01Z')
              return context.digest, canonical_digest(result)
          assert run()==run(); print('scene context/result digests:', *run())
          PY
      - name: Test deterministic Context Assembly
        run: |
          python -m unittest discover -s tests/context -p 'test_*.py'
          vss context assemble --request tests/fixtures/context/context-assembly-request-valid.json --package tests/fixtures/knowledge/knowledge-package-valid.json --environment development --correlation-id m3-5-local-assemble
          vss context validate --input tests/fixtures/context/context-object-valid.json --environment development --correlation-id m3-5-ci-validation
      - name: Test infrastructure contract
        run: python -m unittest discover -s tests/iac_contract -p 'test_*.py'
      - name: Test security supply-chain controls
        run: python -m unittest discover -s tests/security -p 'test_*.py'
      - name: Check Ansible syntax
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/locks/bootstrap-py312.lock.txt
          ansible-inventory -i ansible/inventories/development/hosts.yml --list > /dev/null
          ansible-playbook --syntax-check -i ansible/inventories/development/hosts.yml ansible/playbooks/site.yml
          ansible-playbook --syntax-check -i ansible/inventories/development/hosts.yml ansible/playbooks/bootstrap-local.yml
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.9.0
      - name: Check infrastructure formatting and validation
        run: |
          tofu fmt -check -recursive infrastructure
          while IFS= read -r environment; do
            if [[ $environment == infrastructure/environments/development/local ]]; then
              tofu -chdir="$environment" init -backend=false -lockfile=readonly
            else
              tofu -chdir="$environment" init -backend=false
            fi
            tofu -chdir="$environment" validate
          done < <(find infrastructure/environments -type f -name '*.tf' -printf '%h\n' | sort -u)
      - name: Test hardened object-storage lifecycle and S3 contract
        run: scripts/acceptance-object-storage.sh

  test:
    name: Test
    needs: [secret-scan, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Bash test suite
        id: bash-tests
        shell: bash
        run: |
          set -uo pipefail
          report="bash-test-report.txt"
          : > "$report"
          status=0
          mapfile -d '' test_files < <(find tests -type f -name '*-test.sh' -print0 | sort -z)
          if (( ${#test_files[@]} == 0 )); then
            echo "No Bash tests found" | tee -a "$report"
          fi
          for test_file in "${test_files[@]}"; do
            echo "===== ${test_file} =====" | tee -a "$report"
            if bash "$test_file" >> "$report" 2>&1; then
              echo "PASS: ${test_file}" | tee -a "$report"
            else
              rc=$?
              echo "FAIL: ${test_file} (exit ${rc})" | tee -a "$report"
              status=1
            fi
          done
          cat "$report"
          exit "$status"
      - name: Test phase 0 on clean Ubuntu 26.04
        run: scripts/acceptance-ubuntu-26.04-image.sh
