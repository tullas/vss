[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vss-config"
version = "0.1.0"
description = "Schema-validated configuration engine for VSS automation"
requires-python = ">=3.11,<3.15"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vss = "vss_commands.cli:main"
