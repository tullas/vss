[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vss-config"
version = "0.1.0"
description = "Schema-validated configuration engine for VSS automation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.20,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vss = "vss_commands.cli:main"
